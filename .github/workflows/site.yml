name: site

# Checks for the static site and repo tooling. Never deploys.
on:
  push:
    paths:
      - "public/**"
      - "src/**"
      - "test/**"
      - "market-research/tests/ui/**"
      # test/breaker-bay reads the pipeline's golden snapshot.
      - "market-research/tests/fixtures/expected/snapshot/**"
      - "scripts/**"
      - "package.json"
      - "wrangler.template.toml"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "public/**"
      - "src/**"
      - "test/**"
      - "market-research/tests/ui/**"
      # test/breaker-bay reads the pipeline's golden snapshot.
      - "market-research/tests/fixtures/expected/snapshot/**"
      - "scripts/**"
      - "package.json"
      - "wrangler.template.toml"
      - ".github/workflows/site.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Bookmarklet href matches public/trace/bookmarklet.src.js
        run: node scripts/build-bookmarklet.mjs --check
      - name: All Node tests (npm test; needs no npm install)
        run: npm test
