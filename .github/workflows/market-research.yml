name: market-research

# Tests only: CI never runs the pipeline and never touches R2.
on:
  push:
    paths:
      - "market-research/**"
      # test_publish checks the documented snapshot contract against the package schemas.
      - "docs/market-research/snapshot-contract/**"
      - "public/market-research/**"
      - "public/shared/jw/**"
      - ".github/workflows/market-research.yml"
  pull_request:
    paths:
      - "market-research/**"
      # test_publish checks the documented snapshot contract against the package schemas.
      - "docs/market-research/snapshot-contract/**"
      - "public/market-research/**"
      - "public/shared/jw/**"
      - ".github/workflows/market-research.yml"

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: market-research
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install (hash-pinned)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes --no-deps -r requirements-dev.lock
          pip install --no-deps --no-build-isolation -e .
      - name: ruff
        run: ruff check pipeline tests && ruff format --check pipeline tests
      - name: mypy
        run: mypy
      - name: pytest (network disabled)
        run: pytest --cov --cov-report=term
      - name: pip-audit
        run: pip-audit --strict --require-hashes --disable-pip -r requirements.lock

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t market-research:ci market-research
      - name: Runs as non-root with a read-only root filesystem
        run: |
          test "$(docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges --entrypoint id market-research:ci -u)" = "10001"
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges market-research:ci --help

  page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: data.js against the pipeline's golden snapshot
        run: node --test market-research/tests/ui/*.test.mjs
