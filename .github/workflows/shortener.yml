name: shortener

# Unit tests for the link shortener Worker (src/). Never deploys and never touches D1.
on:
  push:
    paths:
      - "src/**"
      - "test/worker/**"
      - "test/*.log"
      - ".github/workflows/shortener.yml"
  pull_request:
    paths:
      - "src/**"
      - "test/worker/**"
      - "test/*.log"
      - ".github/workflows/shortener.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Worker unit tests
        run: node --test test/worker/*.test.mjs
